services:
  - type: web
    name: realtime-telemetry-pipeline
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: MONGO_URL
        value: ""
      - key: DB_NAME
        value: telemetry
      - key: CORS_ORIGINS
        value: "*"
